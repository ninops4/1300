<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ballo4ever</title>

<!-- استدعاء خط Cairo للحصول على مظهر عصري -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  min-height: 100vh;
  background-color: #0b0f19;
  color: #e8edf5;
  font-family: 'Cairo', system-ui, -apple-system, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

/* =====================================================
   ANIMATED BACKGROUND
   ===================================================== */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  /* تأثير تدرج لوني متحرك بديل للصورة في حال عدم وجودها */
  background: linear-gradient(-45deg, #0a0f1c, #111a30, #091221, #0f1c3f);
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at top right, rgba(0, 110, 255, 0.15), transparent 50%),
              radial-gradient(circle at bottom left, rgba(140, 0, 255, 0.1), transparent 50%);
  z-index: 0;
  pointer-events: none;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* =====================================================
   MAIN CONTAINER (Glassmorphism)
   ===================================================== */
#container {
  width: 100%;
  max-width: 850px;
  padding: 45px 40px;
  margin: 20px;
  background: rgba(15, 22, 36, 0.65);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 30px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
              inset 0 1px 0 rgba(255, 255, 255, 0.1);
  text-align: center;
  position: relative;
  z-index: 1;
}

/* =====================================================
   HEADER
   ===================================================== */
#main-header {
  margin-bottom: 35px;
  padding-bottom: 25px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

#main-header h1 {
  font-size: 56px;
  line-height: 1.2;
  font-weight: 800;
  color: #ffffff;
  margin-bottom: 10px;
  letter-spacing: 2px;
  text-shadow: 0 0 15px rgba(0, 132, 255, 0.6),
               0 0 30px rgba(0, 132, 255, 0.4);
  animation: titleGlow 3s ease-in-out infinite alternate;
}

@keyframes titleGlow {
  from { text-shadow: 0 0 10px rgba(0, 140, 255, 0.5), 0 0 20px rgba(0, 100, 255, 0.3); }
  to { text-shadow: 0 0 20px rgba(0, 170, 255, 0.8), 0 0 40px rgba(0, 120, 255, 0.6); }
}

#main-header .sub {
  font-size: 20px;
  color: #a0aec0;
  font-weight: 600;
}

#main-header .sub span {
  color: #3b82f6;
}

/* =====================================================
   CARD
   ===================================================== */
.card {
  background: rgba(0, 0, 0, 0.3);
  border-radius: 24px;
  padding: 35px 30px;
  border: 1px solid rgba(255, 255, 255, 0.04);
  box-shadow: inset 0 2px 20px rgba(0, 0, 0, 0.5);
}

/* =====================================================
   STATE
   ===================================================== */
#state {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 75px;
  padding: 15px;
  margin: 0 0 25px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(59, 130, 246, 0.2);
  font-size: 28px;
  font-weight: 700;
  color: #eff6ff;
  text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
  transition: all 0.3s ease;
}

/* =====================================================
   DETAILS
   ===================================================== */
#det {
  font-size: 19px;
  color: #cbd5e1;
  margin: 15px 0;
  padding: 18px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.05);
}

#det b {
  color: #ffffff;
  font-size: 20px;
  background: linear-gradient(90deg, rgba(59,130,246,0.3) 0%, rgba(37,99,235,0.1) 100%);
  padding: 4px 14px;
  border-radius: 10px;
  border: 1px solid rgba(59, 130, 246, 0.3);
}

#det .chip {
  display: inline-block;
  background: rgba(16, 185, 129, 0.15);
  padding: 4px 16px;
  border-radius: 12px;
  color: #34d399;
  font-size: 18px;
  font-weight: 700;
  margin: 0 8px;
  border: 1px solid rgba(16, 185, 129, 0.3);
  box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
}

/* =====================================================
   CACHE
   ===================================================== */
#cache {
  font-size: 17px;
  color: #94a3b8;
  margin: 15px 0 5px;
  padding: 10px 25px;
  border-radius: 14px;
  display: inline-block;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.04);
  transition: all 0.3s ease;
}

#cache.cacheok {
  color: #10b981;
  background: rgba(16, 185, 129, 0.1);
  border-color: rgba(16, 185, 129, 0.3);
  box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
}

/* =====================================================
   STATUS COLORS
   ===================================================== */
.ok { color: #34d399 !important; border-color: rgba(52, 211, 153, 0.3) !important; }
.bad { color: #f87171 !important; border-color: rgba(248, 113, 113, 0.3) !important; background: rgba(248,113,113,0.05) !important;}
.warn { color: #fbbf24 !important; border-color: rgba(251, 191, 36, 0.3) !important; }

/* =====================================================
   LOADING DOTS
   ===================================================== */
.loading {
  margin-top: 25px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
}

.loader-dot {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #3b82f6;
  box-shadow: 0 0 10px #3b82f6, 0 0 20px #2563eb;
  animation: dot-bounce 1.4s infinite ease-in-out both;
}

.loader-dot:nth-child(1) { animation-delay: -0.32s; }
.loader-dot:nth-child(2) { animation-delay: -0.16s; }
.loader-dot:nth-child(3) { animation-delay: 0s; }

@keyframes dot-bounce {
  0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
  40% { transform: scale(1); opacity: 1; }
}

/* =====================================================
   FOOTER
   ===================================================== */
.footer-brand {
  position: fixed;
  bottom: 20px;
  right: 30px;
  z-index: 2;
  font-size: 14px;
  font-weight: 800;
  color: rgba(255, 255, 255, 0.3);
  letter-spacing: 1px;
}

/* =====================================================
   MOBILE
   ===================================================== */
@media (max-width: 600px) {
  #container {
    padding: 35px 20px;
    margin: 15px;
    border-radius: 24px;
  }
  #main-header h1 { font-size: 42px; }
  #main-header .sub { font-size: 16px; }
  .card { padding: 25px 15px; }
  #state { font-size: 22px; min-height: 65px; }
  #det { font-size: 16px; padding: 15px 10px; }
}

</style>
</head>

<body>

<div id="container">

  <!-- HEADER -->
  <div id="main-header">
    <h1>Ballo4ever</h1>
    <div class="sub">
      هذه الصفحة صممت بواسطة م/محمد ابوالعنين
    </div>
  </div>

  <!-- MAIN CARD -->
  <div class="card">

    <div id="state">
      جارٍ كشف النسخة...
    </div>

    <div id="det"></div>

    <div id="cache"></div>

    <!-- Loading -->
    <div class="loading">
      <span class="loader-dot"></span>
      <span class="loader-dot"></span>
      <span class="loader-dot"></span>
    </div>

  </div>

</div>

<!-- FOOTER -->
<div class="footer-brand">
  PS4 AI TOOL
</div>

<script>
(function () {

    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");

    function setState(t, c) {
        stateEl.innerHTML = t;
        stateEl.className = c || "";
    }

    function setCache(t, ok) {
        cacheEl.textContent = t;
        cacheEl.className = ok ? "cacheok" : "";
    }

    var params = new URLSearchParams(location.search);
    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);

    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var bug = null, why = "";
    var forced = params.get("bug");

    if (forced === "lapse" || forced === "poops") {
        bug = forced;
        why = "تم التحديد يدوياً ?bug=" + forced;
    } else if (!key) {
        why = "هذا المتصفح ليس بلايستيشن 4";
    } else if (fwnum <= 1202) {
        bug = "lapse";
        why = key + " — متوافق (Lapse)";
    } else if (fwnum >= 1250) {
        bug = "poops";
        why = key + " — متوافق (Poops)";
    } else {
        why = key + " — غير مدعوم";
    }

    /* عرض معلومات النظام */
    var fwDisplay = key ? "<b>" + key + "</b>" : "<span style='color:#8f9eb0;'>غير معروف</span>";
    var bugDisplay = bug ? "<span class='chip'>" + bug.toUpperCase() + "</span>" : "<span style='color:#8f9eb0;'>لا يوجد</span>";

    detEl.innerHTML = "النظام " + fwDisplay + " &nbsp;•&nbsp; " + "الثغرة " + bugDisplay + " &nbsp;•&nbsp; " + why;

    /* إذا لم تكن النسخة مدعومة */
    if (!bug) {
        setState("نسخة غير مدعومة", "bad");
        return;
    }

    /* تحديد الصفحة المطلوبة */
    var target = (bug === "lapse" ? "run_lapse.html" : "PS4_13.00_Webkit.html") + location.search;

    function go() {
        setState("جارٍ تحميل " + bug + " ...", "warn");
        location.replace(target);
    }

    /* انتظار الضغط */
    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    /* Application Cache */
    var ac = window.applicationCache;

    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("غير متصل — التشغيل من التخزين المؤقت", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("التخزين المؤقت جاهز", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("تم تحميل التحديث", true);
        waitForTap("تحديث جاهز — اضغط للتحديث والتشغيل", function () { location.reload(); });
    } else {
        setCache("جارٍ التحقق من التخزين المؤقت...");

        ac.addEventListener("downloading", function () {
            setCache("التخزين المؤقت للمرة الأولى...");
        }, false);

        ac.addEventListener("progress", function (e) {
            if (e && e.total) {
                setCache("تخزين " + Math.round((e.loaded / e.total) * 100) + "%");
            }
        }, false);

        ac.addEventListener("cached", function () {
            setCache("تم التخزين المؤقت — جاهز للاستخدام دون اتصال", true);
            waitForTap("جاهز — اضغط للتشغيل", go);
        }, false);

        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("التحديث جاهز", true);
            waitForTap("تحديث جاهز — اضغط لإعادة التحميل", function () { location.reload(); });
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("التخزين المؤقت جاهز", true);
            go();
        }, false);

        ac.addEventListener("error", function () {
            setCache("فشل التخزين المؤقت");
            waitForTap("فشل التخزين — اضغط للتشغيل رغم ذلك", go);
        }, false);

        ac.addEventListener("obsolete", function () {
            setCache("التخزين المؤقت قديم");
            waitForTap("التخزين قديم — اضغط للتشغيل", go);
        }, false);
    }
})();
</script>

</body>
</html>
